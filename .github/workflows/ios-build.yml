name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Put uploaded touch-control files in place
        run: |
          cp apps/openmw/ios/platform.m apps/openmw/ios/platform.mm
          for f in apps/openmw/mwgui/windowmanagerimp*; do
            case "$f" in
              */windowmanagerimp.cpp|*/windowmanagerimp.hpp) continue;;
            esac
            if grep -q "guiModeActive" "$f"; then
              if grep -q "^#ifndef MWGUI_WINDOWMANAGERIMP_H" "$f"; then
                cp "$f" apps/openmw/mwgui/windowmanagerimp.hpp
              else
                cp "$f" apps/openmw/mwgui/windowmanagerimp.cpp
              fi
            fi
          done
          grep -c OMWTouchOverlay apps/openmw/ios/platform.mm
          grep -c guiModeActive apps/openmw/mwgui/windowmanagerimp.cpp apps/openmw/mwgui/windowmanagerimp.hpp

      - name: Select newest Xcode 27
        run: |
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja meson xcodegen pkgconf python bison

      - name: Disable code signing for CI
        run: |
          sed -i '' \
            -e 's| -allowProvisioningUpdates||' \
            -e 's|DEVELOPMENT_TEAM="\$TEAM_ID" "\$@"|DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO "$@"|' \
            -e 's|codesign --remove-signature "\$out/Payload/OpenMW.app"|codesign --remove-signature "$out/Payload/OpenMW.app" \|\| true|' \
            ios/build.sh
          git diff --stat

      - name: Build dependencies and app (device, release)
        run: ./build-ios.sh build device --release

      - name: Package unsigned IPA
        run: ./build-ios.sh ipa --release --unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMW-unsigned-ipa
          path: DerivedData/ipa/OpenMW-unsigned.ipa
